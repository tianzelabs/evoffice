[project]
name = "pixel-office"
version = "0.0.0"
description = "A 2D pixel trading office: one manager agent, one RLM trader agent, a public chat, a leaderboard."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",   # [standard] brings the websockets implementation
    "httpx>=0.27",               # agents talk to the office server over HTTP
    "openai>=1.50",              # OpenAI-compatible client for OpenRouter (manager)
    "rlms==0.1.3",               # Recursive Language Models (trader); 0.x, so pinned exactly
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

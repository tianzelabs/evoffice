[project]
name = "pixel-office"
version = "0.0.0"
description = "EvOffice: a hobby research project for AI collectives and recursive analytics."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",   # [standard] brings the websockets implementation
    "httpx>=0.27",               # agents talk to the office server over HTTP
    "langchain>=1.4,<2",         # manager agent (create_agent)
    "langchain-openai>=1.7,<2",  # OpenAI-compatible chat model, pointed at OpenRouter
    "rlms==0.1.3",               # Recursive Language Models (trader); 0.x, so pinned exactly
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EvOffice</title>
</head>
<body>
  <header>
    <h1>EvOffice</h1>
    <span id="price">BTC-PERP …</span>
    <span class="muted" id="budget"></span>
    <span class="muted" id="me"></span>
    <span class="replay-ctl"><input type="date" id="replay-day"><select id="replay-speed"><option value="30">×30</option><option value="60" selected>×60</option><option value="240">×240</option></select><button id="replay-go">▶ replay</button><a id="live-link" href="/" hidden>● back to live</a></span>
    <a class="muted" href="/text">text view</a>
  </header>
  <main>
    <div id="room"></div>
    <aside>
      <section class="chat">
        <h2>Office chat</h2>
        <div id="log"></div>
        <form id="say"><input id="text" placeholder="Speak as the boss" autocomplete="off" maxlength="2000"><button>Send</button></form>
      </section>
      <section>
        <h2>Objective — minus → plus</h2>
        <div id="objective" class="muted">…</div>
        <h2>Season <span id="season-name" class="muted"></span></h2>
        <div id="season" class="muted">…</div>
        <h2>Iteration — did the change help?</h2>
        <div id="iterations" class="muted">…</div>
        <h2>Leaderboard</h2>
        <table id="board"><thead><tr><th>trader</th><th>trades</th><th>net</th><th>bps</th><th>open</th></tr></thead><tbody></tbody></table>
        <h2>Per strategy version</h2>
        <table id="versions"><thead><tr><th>trader · version</th><th>trades</th><th>net</th><th>bps</th></tr></thead><tbody></tbody></table>
      </section>
    </aside>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
